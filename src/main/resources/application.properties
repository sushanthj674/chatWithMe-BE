spring.application.name=chatWithMeBackend

# Bind on all interfaces so the Android emulator (10.0.2.2) and physical
# devices on the LAN can reach this, not just localhost.
server.address=0.0.0.0
server.port=${PORT:8080}

# H2 file-mode DB, no external server needed. Data persists under ./data
# relative to wherever the app is started from.
spring.datasource.url=jdbc:h2:file:./data/chatwithme;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Firebase Admin SDK service account (NOT google-services.json). See README.
# Provide EITHER the raw JSON contents (FIREBASE_SERVICE_ACCOUNT_JSON, handy
# for hosts like Railway with no file mounts) OR a file path
# (FIREBASE_SERVICE_ACCOUNT_PATH, used by the docker-compose volume mount
# locally). Left blank, FCM pushes are skipped.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}

# A device with no heartbeat in this window is reported as offline by GET /api/devices.
app.device.online-threshold-seconds=45

# Swagger UI at /swagger-ui.html, raw OpenAPI spec at /v3/api-docs.
springdoc.swagger-ui.path=/swagger-ui.html

# Only health/info are exposed — this app has no auth in front of it yet, and
# endpoints like env/metrics can leak config to anyone with the URL.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
